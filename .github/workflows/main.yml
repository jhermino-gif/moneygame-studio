
name: Construir APK de MoneyStudio

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Comprobar proyecto Android
        run: |
          if [ ! -f ./gradlew ]; then
            echo "Falta el archivo gradlew en la raiz del proyecto"
            exit 1
          fi
          if [ ! -d ./app ]; then
            echo "Falta la carpeta app del proyecto Android"
            exit 1
          fi

      - name: Construir APK
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Guardar APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MoneyStudio-APK
          path: app/build/outputs/apk/debug/*.apk

